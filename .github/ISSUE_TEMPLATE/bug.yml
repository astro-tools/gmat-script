name: Bug
description: Report a defect in gmat-script.
title: "<short summary>"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: >-
        If the problem is that a valid GMAT script does not parse, or lints wrong, please use the
        "My script does not parse / lints wrong" template instead — it asks for the right details.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Observed behavior. Include error messages and tracebacks verbatim.
    validations:
      required: true
  - type: textarea
    id: what_expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest Python or CLI invocation that triggers the bug.
      render: python
    validations:
      required: true
  - type: input
    id: gmat_script_version
    attributes:
      label: gmat-script version
      placeholder: "e.g. 0.1.0, or git sha"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output — tracebacks, warnings, pytest output.
      render: shell
