name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build the abi3 wheels on each platform. cibuildwheel reads [tool.cibuildwheel] from
  # pyproject.toml: one cp310 build per platform, producing a stable-ABI wheel that runs on 3.10+.
  build-wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/gmat-script
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Publish the tree-sitter grammar to npm so editor / syntax-highlighting consumers can pull it
  # without the Python package. The grammar is a self-contained npm package under tree-sitter-gmat/,
  # versioned independently of the Python distribution. Auth is npm OIDC trusted publishing — no
  # stored token — and provenance is attached automatically. The job is idempotent: it skips when the
  # version is already on the registry, so a tag whose grammar version was bootstrapped by a manual
  # publish is a no-op here.
  publish-npm:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Use an OIDC-capable npm
        run: npm install -g npm@latest
      - name: Publish grammar to npm (skip if the version is already published)
        working-directory: tree-sitter-gmat
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "tree-sitter-gmat@${version}" version >/dev/null 2>&1; then
            echo "tree-sitter-gmat@${version} is already on the registry — skipping."
          else
            npm publish
          fi

  # Publish the VS Code extension (editors/vscode/) to the VS Code Marketplace and Open VSX. Auth is
  # user-provided tokens stored as the VSCE_PAT and OVSX_PAT repository secrets (the Marketplace
  # publisher and the Open VSX namespace must be created once, like the PyPI pending publisher). Each
  # publish step is skipped when its token is absent and is idempotent: it checks the registry for the
  # current version first, so a tag whose extension version is already published is a no-op.
  publish-vscode:
    name: publish VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: Package the .vsix
        run: npx @vscode/vsce package --out gmat-script.vsix
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          id="$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")"
          if npx @vscode/vsce show "${id}" --json > /tmp/ext.json 2>/dev/null \
             && node -e "process.exit((JSON.parse(require('fs').readFileSync('/tmp/ext.json','utf8')).versions||[]).some(v => v.version === '${version}') ? 0 : 1)"; then
            echo "${id}@${version} is already on the Marketplace — skipping."
          else
            npx @vscode/vsce publish --packagePath gmat-script.vsix
          fi
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          id="$(node -p "require('./package.json').publisher + '.' + require('./package.json').name")"
          if npx ovsx get "${id}" -t "${version}" -o /tmp/ovsx.vsix > /dev/null 2>&1; then
            echo "${id}@${version} is already on Open VSX — skipping."
          else
            npx ovsx publish gmat-script.vsix
          fi

  github-release:
    name: github release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
