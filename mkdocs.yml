site_name: gmat-script
site_description: Parse, format, lint, and edit GMAT mission scripts from Python.
site_url: https://astro-tools.github.io/gmat-script/
repo_url: https://github.com/astro-tools/gmat-script
repo_name: astro-tools/gmat-script
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Grammar surface: grammar-surface.md
  - Typed AST: typed-ast.md
  - Editing: editing.md
  - Formatter: formatting.md
  - Linter: lint.md
  - Field catalogue: catalogue.md
  - CLI: cli.md
  - Editor tooling:
      - Language server: lsp.md
      - VS Code extension: vscode.md
  - Error reporting: errors.md
  - API reference: api.md
  - Design:
      - Decisions: design/decisions.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            docstring_style: sphinx
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/astro-tools/gmat-script
