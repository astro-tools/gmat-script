[build-system]
requires = ["hatchling", "setuptools>=61"]
build-backend = "hatchling.build"

[project]
name = "gmat-script"
description = "Parse, format, lint, and edit GMAT mission scripts from Python — a tree-sitter grammar and tooling."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dimitrije Jankovic" }]
keywords = [
  "gmat",
  "tree-sitter",
  "parser",
  "linter",
  "formatter",
  "astrodynamics",
  "mission-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
dependencies = [
  "tree-sitter>=0.25,<0.26",
]
dynamic = ["version"]

[project.scripts]
gmat-script = "gmat_script.cli:main"

[project.urls]
Homepage = "https://github.com/astro-tools/gmat-script"
Repository = "https://github.com/astro-tools/gmat-script"
Issues = "https://github.com/astro-tools/gmat-script/issues"
Documentation = "https://astro-tools.github.io/gmat-script/"
Changelog = "https://github.com/astro-tools/gmat-script/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[tool.hatch.version]
path = "src/gmat_script/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gmat_script"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Ship the grammar source + the build hook so an sdist can rebuild the wheel with only a C
# compiler (no Node / tree-sitter CLI). Generated build artifacts stay out via .gitignore.
include = [
  "src/gmat_script",
  "tree-sitter-gmat/grammar.js",
  "tree-sitter-gmat/tree-sitter.json",
  "tree-sitter-gmat/package.json",
  "tree-sitter-gmat/src",
  "tree-sitter-gmat/bindings",
  "tree-sitter-gmat/queries",
  "tree-sitter-gmat/test",
  "hatch_build.py",
  "docs",
  "tests",
  "mkdocs.yml",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CITATION.cff",
]

[tool.cibuildwheel]
# Build one CPython-3.10 wheel per platform; the stable ABI makes it run on 3.10+.
build = "cp310-*"
skip = "*-musllinux*"
build-frontend = "build"
test-requires = ["tree-sitter>=0.25,<0.26"]
test-command = "python -c \"import gmat_script; from gmat_script._grammar import language; from tree_sitter import Language; Language(language())\""

# 64-bit only on Linux and Windows: tree-sitter ships no 32-bit (i686 / win32) wheels, so the test
# step would compile it from source there and fail. The grammar wheel targets 64-bit platforms.
[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["tree-sitter-gmat"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # flake8-bugbear
  "UP",       # pyupgrade
  "SIM",      # flake8-simplify
  "RUF",      # ruff-specific
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/gmat_script", "tests"]

# The tree-sitter runtime is typed, but guard against a stubless release.
[[tool.mypy.overrides]]
module = ["tree_sitter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "corpus: parses the stock GMAT sample corpus (the corpus-coverage job).",
]

[tool.coverage.run]
source = ["src/gmat_script"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "^\\s*\\.\\.\\.$",
]
